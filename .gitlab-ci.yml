image: mingc/android-build-box:latest

build:
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon assembleDebug
  artifacts:
    name: "elderfriend-debug"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 1 month

discord_notify:
  stage: deploy
  image: alpine:3.21
  rules:
    - if: '$CI_COMMIT_TAG != null'
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      jq -n --arg p "$CI_PROJECT_TITLE" --arg t "$CI_COMMIT_TAG" --arg u "$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG" \
        '{username:"GitLab",embeds:[{title:"Also updated on GitLab!",url:$u,description:"\($p) \($t) is now on GitLab.",color:16556326}]}' \
        | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
